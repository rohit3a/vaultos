name: Bug report
description: Report a reproducible problem with synthetic data
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security issues use private vulnerability reporting. Never attach credentials, vaults, private keys, personal paths or full audit logs."
  - type: input
    id: version
    attributes:
      label: VaultOS version and macOS version/architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce with a new synthetic vault
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
