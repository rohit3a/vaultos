name: Publish unsigned preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.1.0-preview.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-14
          - arch: x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and preview version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const p=require("./package.json");if(!/^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=="v"+p.version)process.exit(1)'
      - run: brew install age
      - run: npm ci
      - run: VAULTOS_BUILD_TEST_HELPER=1 npm run build:native && npm run check && npm run test:ui
      - run: npm audit --audit-level=high
      - run: npm run dist:mac
        env:
          VAULTOS_ARCH: ${{ matrix.arch }}
      - run: node scripts/test-packaged.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: artifacts
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "VaultOS $RELEASE_TAG — unsigned macOS preview" --notes-file docs/RELEASE_NOTES.md
