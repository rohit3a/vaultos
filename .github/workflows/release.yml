name: Publish unsigned preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.1.0-preview.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and preview version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const p=require("./package.json");if(!/^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=="v"+p.version)process.exit(1)'
      - run: brew install age
      - run: npm ci
      - run: VAULTOS_BUILD_TEST_HELPER=1 npm run build:native && npm run check && npm run test:ui
      - run: npm audit --audit-level=high
      - run: npm run dist:mac
        env:
          VAULTOS_ARCH: ${{ matrix.arch }}
      - if: matrix.arch == 'arm64'
        run: node scripts/test-packaged.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: artifacts
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "VaultOS $RELEASE_TAG — unsigned macOS preview" --notes-file docs/RELEASE_NOTES.md
